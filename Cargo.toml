[package]
name = "orbit-realtime-rust"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Bounded Server-Sent Events bodies for Orbit applications"
readme = "README.md"
include = ["src/**", "tests/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "docs/**"]

[dependencies]
bytes = "1"
futures-core = "0.3"
http = "1"
http-body = "1"

[dev-dependencies]
futures-util = "0.3"
http-body-util = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
